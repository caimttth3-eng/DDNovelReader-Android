name: Build Android APK

on:
  push:
    branches: [master, 'codex/**']
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Restore dependencies
        run: flutter pub get
      - name: Check Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test reader interactions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          flutter test
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DDNovelReader-ui-previews
          path: build/ui-previews/*.png
          if-no-files-found: warn
      - name: Probe online voice service
        continue-on-error: true
        timeout-minutes: 2
        run: DD_READER_LIVE_TTS=1 flutter test test/edge_live_test.dart --reporter expanded
      - name: Restore Gradle wrapper
        run: |
          flutter create --platforms=android --project-name wrapper_seed /tmp/wrapper_seed
          cp /tmp/wrapper_seed/android/gradlew android/gradlew
          cp /tmp/wrapper_seed/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
      - name: Build installable APK
        run: flutter build apk --release
      - name: Check APK signature and checksum
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DDNovelReader-gestures-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
